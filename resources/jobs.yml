resources:
  jobs:
    project_setup:
      name: covid19-socioeconomic-setup

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
    
    source_landing:
      name: covid19-socioeconomic-source-landing

      tasks:
        - task_key: land_covid
          notebook_task:
            notebook_path: ../landing/covid.py

        - task_key: land_gdp
          notebook_task:
            notebook_path: ../landing/gdp.py

        - task_key: land_healthcare
          notebook_task:
            notebook_path: ../landing/healthcare.py
            base_parameters:
              source_dir: ${workspace.file_path}/data

    socioeconomic_etl:
      name: covid19-socioeconomic-etl

      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.socioeconomic_pipeline.id}
            full_refresh: false
